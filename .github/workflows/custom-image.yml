# Builds the custom images: upstream stash with the patches on the custom
# branch, as ghcr.io/<owner>/stash:custom, and in the hotio/stash image
# (HOTIO_IMAGE) in place of its own stash, as ghcr.io/<owner>/stash:hotio.
#
# The custom branch is the upstream commit recorded by the upstream branch,
# plus the patches. Each run moves both to the newest upstream base and pushes
# the images that are not built yet, :hotio also when only HOTIO_IMAGE changed.
#
# Failures open an issue labelled custom-image, which the next successful run
# closes.
#
# Requires a SYNC_TOKEN secret: a fine-grained token for this repository with
# contents and workflows write permission, since upstream commits change
# workflow files, which GITHUB_TOKEN cannot push.

name: Custom image

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - custom

concurrency:
  group: custom-image

permissions:
  contents: read
  packages: write
  issues: write

env:
  UPSTREAM_REPO: stashapp/stash
  # build upstream develop until a release newer than this is published,
  # then build releases only
  FOLLOW_DEVELOP_UNTIL_AFTER: v0.31.1
  HOTIO_IMAGE: ghcr.io/hotio/stash:release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Choose upstream base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags "https://github.com/$UPSTREAM_REPO.git" \
            +refs/heads/develop:refs/remotes/upstream/develop \
            '+refs/tags/v*:refs/tags/v*'

          release=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          newest=$(printf '%s\n' "$FOLLOW_DEVELOP_UNTIL_AFTER" "$release" | sort -V | tail -n1)
          if [ "$release" != "$FOLLOW_DEVELOP_UNTIL_AFTER" ] && [ "$newest" = "$release" ]; then
            target=$(git rev-parse "refs/tags/$release^{commit}")
            echo "Following release $release"
          else
            target=$(git rev-parse upstream/develop)
            echo "Following develop: $(git log -1 --format='%h %s' "$target")"
          fi

          # the upstream branch records the base of the patches. If it is
          # missing, assume the patches are based on develop.
          current=$(git rev-parse -q --verify origin/upstream || git merge-base HEAD upstream/develop)

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$target" != "$current" ] && ! git merge-base --is-ancestor "$target" HEAD; then
            echo "rebase=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase onto upstream
        id: rebase
        if: steps.base.outputs.rebase == 'true'
        env:
          CONFLICTS_FILE: ${{ runner.temp }}/conflicts.md
          CURRENT: ${{ steps.base.outputs.current }}
          TARGET: ${{ steps.base.outputs.target }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the script is part of the branch being rebased, so run a copy
          cp .github/scripts/rebase-custom.sh "$RUNNER_TEMP/"
          "$RUNNER_TEMP/rebase-custom.sh" "$CURRENT" "$TARGET"

      - name: Image metadata
        id: meta
        env:
          TARGET: ${{ steps.base.outputs.target }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stash" >> "$GITHUB_OUTPUT"
          sha=$(git rev-parse --short=12 HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          describe=$(git describe --tags --exclude latest_develop "$TARGET")
          echo "version=$describe-custom" >> "$GITHUB_OUTPUT"
          echo "hotio_version=$describe-hotio" >> "$GITHUB_OUTPUT"
          # pin the hotio image for this build
          hotio=$(docker buildx imagetools inspect "$HOTIO_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "$hotio" != sha256:* ]]; then
            echo "cannot find the digest of $HOTIO_IMAGE" >&2
            exit 1
          fi
          echo "hotio=$HOTIO_IMAGE@$hotio" >> "$GITHUB_OUTPUT"
          # a build of these patches on this hotio image
          echo "hotio_build=sha-$sha-hotio-${hotio:7:12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check for existing images
        id: exists
        env:
          CUSTOM: ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          HOTIO: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.hotio_build }}
        run: |
          check() {
            if docker buildx imagetools inspect "$2" > /dev/null 2>&1; then
              echo "$2 already exists"
              echo "$1=true" >> "$GITHUB_OUTPUT"
            fi
          }
          check custom "$CUSTOM"
          check hotio "$HOTIO"

      - name: Test
        if: steps.exists.outputs.custom != 'true' || steps.exists.outputs.hotio != 'true'
        run: go test -race ./pkg/file/...

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.custom != 'true' || steps.exists.outputs.hotio != 'true'

      - name: Build and push image
        if: steps.exists.outputs.custom != 'true'
        uses: docker/build-push-action@v6
        with:
          # the working tree, not the commit that triggered the run
          context: .
          file: docker/build/x86_64/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GITHASH=${{ steps.meta.outputs.sha }}
            STASH_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
          tags: |
            ${{ steps.meta.outputs.image }}:custom
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write hotio Dockerfile
        if: steps.exists.outputs.hotio != 'true'
        env:
          HOTIO: ${{ steps.meta.outputs.hotio }}
        run: .github/scripts/hotio-dockerfile.sh "$HOTIO" > "$RUNNER_TEMP/hotio.Dockerfile"

      - name: Build hotio image
        if: steps.exists.outputs.hotio != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/hotio.Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            GITHASH=${{ steps.meta.outputs.sha }}
            STASH_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.hotio_version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.base.name=${{ steps.meta.outputs.hotio }}
          tags: |
            ${{ steps.meta.outputs.image }}:hotio
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.hotio_version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.hotio_build }}
          # the stages before the last are the same as those of the custom image
          cache-from: |
            type=gha
            type=gha,scope=hotio
          cache-to: type=gha,scope=hotio,mode=max

      # the static build must run in the hotio image, which is not Alpine
      - name: Check that stash runs in the hotio image
        if: steps.exists.outputs.hotio != 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.hotio_build }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          version=$(docker run --rm --entrypoint /app/stash "$IMAGE" --version)
          echo "$version"
          grep -qF "$VERSION" <<< "$version"

      - name: Push hotio image
        if: steps.exists.outputs.hotio != 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.hotio_version }}
          BUILD: ${{ steps.meta.outputs.hotio_build }}
        run: |
          for tag in "$BUILD" "$VERSION" hotio; do
            docker push "$IMAGE:$tag"
          done

      # push only once the images are built, so that the branches never move
      # to a base that fails to build
      - name: Push branches
        if: steps.base.outputs.target != steps.base.outputs.current
        env:
          CURRENT: ${{ steps.base.outputs.current }}
          TARGET: ${{ steps.base.outputs.target }}
          REBASED: ${{ steps.rebase.outcome == 'success' }}
        run: |
          if [ "$REBASED" = true ]; then
            git push --force-with-lease=custom:"$(git rev-parse origin/custom)" origin HEAD:refs/heads/custom
          fi
          lease=$(git rev-parse -q --verify origin/upstream || true)
          git push --force-with-lease=upstream:"$lease" origin "$TARGET:refs/heads/upstream"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REBASE_FAILED: ${{ steps.rebase.outcome == 'failure' }}
          TARGET: ${{ steps.base.outputs.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/report.md"
          {
            if [ "$REBASE_FAILED" = true ]; then
              echo "Rebasing the patches onto upstream \`${TARGET::12}\` failed."
              echo
              cat "$RUNNER_TEMP/conflicts.md" 2>/dev/null || echo "See the log of the rebase step."
              echo
              echo "Resolve the conflicts locally, then push the custom branch. The next run builds it."
              echo
              echo '```sh'
              echo "git fetch origin"
              echo "git fetch https://github.com/$UPSTREAM_REPO.git develop '+refs/tags/v*:refs/tags/v*'"
              echo "git switch custom && git reset --hard origin/custom"
              echo "git rebase --onto $TARGET origin/upstream"
              echo "# resolve the conflicts, git add, git rebase --continue"
              echo "git push --force-with-lease origin custom"
              echo '```'
            else
              echo "Building the custom image failed. See the run log."
            fi
            echo
            echo "Run: $RUN_URL"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

          # one open issue at a time, commented on by later failures
          gh label create custom-image --color d73a4a --description "Custom image build failures" --force
          issue=$(gh issue list --label custom-image --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$report"
          else
            gh issue create --title "Custom image build failed" --label custom-image --body-file "$report"
          fi

      - name: Close failure issues
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for issue in $(gh issue list --label custom-image --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "Fixed by $RUN_URL"
          done
